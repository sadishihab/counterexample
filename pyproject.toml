[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterexample"
version = "0.1.0"
description = "PR verification tool: extract claims, generate adversarial tests, run diff-scoped mutation testing, produce a Review Receipt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Md. Shihabuddin Sadi" }
]
dependencies = [
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
counterexample = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"
